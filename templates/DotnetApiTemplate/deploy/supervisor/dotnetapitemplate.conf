; Supervisor programs for a VM / bare-metal server (the Docker image has its own: docker/supervisor/).
; 1. Publish:   dotnet publish src/DotnetApiTemplate.Api -c Release -o /opt/dotnetapitemplate
; 2. Settings:  /opt/dotnetapitemplate/.env (APP_ENV=prod, DB_*, JWT_SIGNING_KEY, EMAIL_*, JOBS_*), readable only by the service user
; 3. Install:   sudo cp deploy/supervisor/dotnetapitemplate.conf /etc/supervisor/conf.d/ && sudo supervisorctl reread && sudo supervisorctl update
; 4. Migrate:   run `dotnet ef database update` (or the reviewed SQL script) before starting a new version
; Status/logs:  sudo supervisorctl status | tail -f dotnetapitemplate-api

[group:dotnetapitemplate]
programs=dotnetapitemplate-api,dotnetapitemplate-worker

[program:dotnetapitemplate-api]
command=/usr/bin/dotnet /opt/dotnetapitemplate/DotnetApiTemplate.Api.dll
directory=/opt/dotnetapitemplate
user=dotnetapitemplate
environment=APP_ROLE="api",ASPNETCORE_HTTP_PORTS="8080",DOTNET_PRINT_TELEMETRY_MESSAGE="false"
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/var/log/dotnetapitemplate/api.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
redirect_stderr=true

[program:dotnetapitemplate-worker]
command=/usr/bin/dotnet /opt/dotnetapitemplate/DotnetApiTemplate.Api.dll
directory=/opt/dotnetapitemplate
user=dotnetapitemplate
environment=APP_ROLE="worker",ASPNETCORE_HTTP_PORTS="8081",DOTNET_PRINT_TELEMETRY_MESSAGE="false"
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=75                 ; above JOBS_SHUTDOWN_TIMEOUT_SECONDS (60)
stdout_logfile=/var/log/dotnetapitemplate/worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
redirect_stderr=true

; More job throughput on one server: raise JOBS_WORKER_COUNT first (parallel jobs per process). For a second
; worker process, copy the worker program with another name and ASPNETCORE_HTTP_PORTS="8082".
