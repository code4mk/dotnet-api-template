; One container, two processes from the same build (see docs/development/background-jobs.md):
;   api    : HTTP API on 8080, enqueues jobs          (APP_ROLE=api)
;   worker : background jobs + recurring schedules    (APP_ROLE=worker), only /health on 8081
; Settings come from the container environment (docker compose env_file: .env, or your platform).

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; `docker exec <container> supervisorctl status` / `restart worker`
[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:api]
command=dotnet /app/DotnetApiTemplate.Api.dll
directory=/app
environment=APP_ROLE="api",ASPNETCORE_HTTP_PORTS="8080"
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=30                 ; running requests finish
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker]
command=dotnet /app/DotnetApiTemplate.Api.dll
directory=/app
environment=APP_ROLE="worker",ASPNETCORE_HTTP_PORTS="8081"
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=75                 ; above JOBS_SHUTDOWN_TIMEOUT_SECONDS (60): running jobs finish or are re-queued
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; If a program can't stay up (FATAL after startretries), stop the whole container so the platform notices and
; restarts it, instead of a container that looks alive with half its processes missing.
[eventlistener:exit-on-fatal]
command=python3 /etc/supervisor/exit-on-fatal.py
events=PROCESS_STATE_FATAL
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
