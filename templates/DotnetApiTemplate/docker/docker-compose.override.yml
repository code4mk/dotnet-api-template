# Local overrides. Docker Compose merges this file automatically when you run from docker/
# without -f. The API environment (Development, Staging, Production) comes from APP_ENV in .env.

services:
  api:
    environment:
      # Inside Docker the API sends email to the Mailpit container.
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      EMAIL_ENABLE_SSL: "false"

  db:
    ports:
      # Expose so you can connect from your IDE or run the API outside Docker.
      # The host port comes from DB_PORT in .env; inside Docker the API still uses db:5432.
      - "${DB_PORT:-54320}:5432"

  # Local email server: catches every email the API sends. Inbox: http://localhost:${MAILPIT_UI_PORT}
  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "${EMAIL_PORT:-21025}:1025"          # SMTP, used by the API when it runs on your machine
      - "${MAILPIT_UI_PORT:-28025}:8025"     # web inbox
    restart: unless-stopped
