# Local development overrides. Docker Compose merges this file automatically.

services:
  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Seed__AdminEmail: "${SEED_ADMIN_EMAIL}"
      Seed__AdminPassword: "${SEED_ADMIN_PASSWORD}"

  db:
    ports:
      # Expose so you can connect from your IDE or run the API outside Docker.
      # The host port comes from DB_PORT in .env; inside Docker the API still uses db:5432.
      - "${DB_PORT:-54320}:5432"
