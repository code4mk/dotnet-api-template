# All settings come from the .env file at the repository root. Run from the docker/ folder:
#   docker compose --env-file ../.env up --build

name: dotnetapitemplate-slug

services:
  api:
    image: dotnetapitemplate-slug-api:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "${API_PORT:-18080}:8080"   # host port from API_PORT in .env
    env_file: ../.env               # APP_ENV, DB_*, JWT_SIGNING_KEY, SEED_*
    environment:
      # Inside Docker the API reaches PostgreSQL through the Compose network.
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${DB_NAME:?set DB_NAME in .env and pass --env-file ../.env}"
      POSTGRES_USER: "${DB_USER:?set DB_USER in .env and pass --env-file ../.env}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD in .env and pass --env-file ../.env}"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
